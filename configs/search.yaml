seed: 42
data_root: Data
source_condition: 1
target_condition: 2
pca_variance: 0.99
channels: both
alignment: coral_mmd

search:
  trials: 12
  validation_bearings: 2
  episodes_per_validation_bearing: 3
  epochs_per_trial: 25
  hidden_size: [16, 32, 64, 128]
  num_layers: [1, 2]
  dropout: [0.0, 0.1, 0.3]
  window_size: [8, 16, 32]
  inner_steps: [1, 3, 5]
  inner_lr: [0.0001, 0.01]
  outer_lr: [0.0001, 0.003]
  weight_decay: [0.0, 0.0001, 0.001]
  meta_batch_size: [2, 4]
  support_size: [5, 9, 16]
  query_size: [8, 16, 32]
  first_order: [true, false]

train:
  epochs: 100
  gradient_clip: 5.0
  target_trials: 20
  device: auto
